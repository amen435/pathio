<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Roadmap — Pathio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&family=Geist+Mono:wght@400;500&family=Hind:wght@300;400&display=swap" rel="stylesheet">
  
  <!-- Component styles first -->
  <link rel="stylesheet" href="components/sidebar.css">
  <link rel="stylesheet" href="components/roadmap-path.css">
  <link rel="stylesheet" href="components/week-detail.css">
  <link rel="stylesheet" href="components/fill-blanks.css">
  <!-- Page styles -->
  <link rel="stylesheet" href="styles/roadmap.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@codemirror/view@6.34.1/dist/index.css">
  <script type="importmap">
  {
    "imports": {
      "codemirror": "https://cdn.jsdelivr.net/npm/codemirror@6.0.1/dist/index.js",
      "@codemirror/state": "https://cdn.jsdelivr.net/npm/@codemirror/state@6.4.1/dist/index.js",
      "@codemirror/view": "https://cdn.jsdelivr.net/npm/@codemirror/view@6.34.1/dist/index.js",
      "@codemirror/language": "https://cdn.jsdelivr.net/npm/@codemirror/language@6.10.6/dist/index.js",
      "@codemirror/commands": "https://cdn.jsdelivr.net/npm/@codemirror/commands@6.7.1/dist/index.js",
      "@codemirror/search": "https://cdn.jsdelivr.net/npm/@codemirror/search@6.5.8/dist/index.js",
      "@codemirror/autocomplete": "https://cdn.jsdelivr.net/npm/@codemirror/autocomplete@6.18.3/dist/index.js",
      "@codemirror/lint": "https://cdn.jsdelivr.net/npm/@codemirror/lint@6.8.4/dist/index.js",
      "@codemirror/lang-javascript": "https://cdn.jsdelivr.net/npm/@codemirror/lang-javascript@6.2.2/dist/index.js",
      "@codemirror/lang-html": "https://cdn.jsdelivr.net/npm/@codemirror/lang-html@6.4.9/dist/index.js",
      "@codemirror/lang-python": "https://cdn.jsdelivr.net/npm/@codemirror/lang-python@6.1.6/dist/index.js",
      "@lezer/common": "https://cdn.jsdelivr.net/npm/@lezer/common@1.2.3/dist/index.js",
      "@lezer/highlight": "https://cdn.jsdelivr.net/npm/@lezer/highlight@1.2.1/dist/index.js",
      "@lezer/lr": "https://cdn.jsdelivr.net/npm/@lezer/lr@1.4.2/dist/index.js",
      "@lezer/javascript": "https://cdn.jsdelivr.net/npm/@lezer/javascript@1.4.19/dist/index.js",
      "@lezer/html": "https://cdn.jsdelivr.net/npm/@lezer/html@1.3.10/dist/index.js",
      "@lezer/python": "https://cdn.jsdelivr.net/npm/@lezer/python@1.1.14/dist/index.js",
      "@lezer/css": "https://cdn.jsdelivr.net/npm/@lezer/css@1.1.8/dist/index.js",
      "style-mod": "https://cdn.jsdelivr.net/npm/style-mod@4.1.2/src/style-mod.js",
      "w3c-keyname": "https://cdn.jsdelivr.net/npm/w3c-keyname@2.2.8/index.js",
      "crelt": "https://cdn.jsdelivr.net/npm/crelt@1.0.6/index.js"
    }
  }
  </script>
</head>
<body>
  <div class="app-shell">
    <!-- Sidebar component -->
    <aside class="sidebar" id="sidebar"></aside>
    
    <!-- Main roadmap path -->
    <main class="roadmap-main">
      <div class="roadmap-header">
        <h1 class="roadmap-title">Your Learning Path</h1>
        <div class="roadmap-meta">
          <span class="meta-item">16 weeks · 10 hrs/week</span>
          <span class="meta-item">Started Jan 2026</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-labels">
            <span>Progress</span>
            <span id="progress-text">Week 5 of 16</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </div>
      </div>
      
      <div class="roadmap-path" id="path-container"></div>
    </main>
    
    <!-- Week detail panel (desktop only, initially) -->
    <aside class="week-detail" id="week-detail">
      <div class="empty-detail-state">
        <p>Select a week to view details.</p>
      </div>
    </aside>
  </div>
  
  <script type="module" src="js/roadmap.js"></script>
</body>
</html>
