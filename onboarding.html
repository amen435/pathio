<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pathio - Onboarding</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=Geist+Mono:wght@400;500;700&family=Hind:wght@400;500;600&display=swap');

        :root {
            --bg: #050A08;
            --surface: #0C1410;
            --surface-2: #101C16;
            --border: #1A2E22;
            --text: #E8F0EB;
            --muted: #8DA197;
            --accent: #3DFF8F;
            --danger: #FF5C7A;
            --shadow: rgba(0, 0, 0, 0.42);
            --bottom-offset: 0px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Hind', system-ui, sans-serif;
        }

        body {
            min-height: 100dvh;
            overflow: hidden;
        }

        button,
        input,
        select {
            font: inherit;
        }

        .app {
            min-height: 100dvh;
            display: grid;
            grid-template-rows: auto 1fr auto;
            background:
                radial-gradient(circle at 10% -10%, rgba(61, 255, 143, 0.1), transparent 34rem),
                linear-gradient(180deg, rgba(12, 20, 16, 0.92), var(--bg) 42%);
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: calc(1rem + env(safe-area-inset-top)) 1rem 1rem;
            border-bottom: 1px solid var(--border);
            background: rgba(5, 10, 8, 0.92);
            backdrop-filter: blur(18px);
        }

        .brand {
            color: var(--text);
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0;
            text-decoration: none;
        }

        .brand span {
            color: var(--accent);
        }

        .progress-wrap {
            min-width: 132px;
            text-align: right;
        }

        .progress-label {
            color: var(--muted);
            font-family: 'Geist Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .progress-track {
            width: 100%;
            height: 4px;
            margin-top: 0.45rem;
            overflow: hidden;
            border-radius: 999px;
            background: var(--border);
        }

        .progress-fill {
            width: 20%;
            height: 100%;
            border-radius: inherit;
            background: var(--accent);
            transition: width 240ms ease;
        }

        .chat-shell {
            width: 100%;
            max-width: 860px;
            min-height: 0;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        .chat {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 1rem 1rem 1.5rem;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            margin: 0.85rem 0;
            animation: riseIn 220ms ease both;
        }

        .message-row.agent {
            justify-content: flex-start;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: min(82%, 620px);
            padding: 0.95rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 18px 40px var(--shadow);
            line-height: 1.45;
            font-size: 1rem;
        }

        .agent .bubble {
            background: var(--surface);
            color: var(--text);
            border-top-left-radius: 2px;
        }

        .user .bubble {
            background: var(--accent);
            color: #041008;
            border-color: var(--accent);
            border-top-right-radius: 2px;
            box-shadow: 0 18px 38px rgba(61, 255, 143, 0.12);
        }

        .message-label {
            display: block;
            margin-bottom: 0.35rem;
            color: var(--muted);
            font-family: 'Geist Mono', monospace;
            font-size: 0.64rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .user .message-label {
            color: rgba(4, 16, 8, 0.62);
        }

        .typing .bubble {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            min-width: 70px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
            animation: bounce 850ms infinite ease-in-out;
        }

        .dot:nth-child(2) {
            animation-delay: 120ms;
        }

        .dot:nth-child(3) {
            animation-delay: 240ms;
        }

        .composer {
            position: sticky;
            bottom: var(--bottom-offset);
            z-index: 10;
            border-top: 1px solid var(--border);
            background: rgba(5, 10, 8, 0.94);
            backdrop-filter: blur(18px);
            padding: 0.8rem 1rem calc(0.8rem + env(safe-area-inset-bottom));
        }

        .composer-inner {
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
        }

        .text-form {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0.65rem;
            align-items: end;
        }

        .answer-input,
        .time-select {
            width: 100%;
            min-height: 48px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            outline: none;
            padding: 0.85rem 0.95rem;
            transition: border-color 180ms ease, box-shadow 180ms ease;
        }

        .answer-input:focus,
        .time-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(61, 255, 143, 0.08);
        }

        .send-btn,
        .option-btn,
        .retry-btn,
        .schedule-submit {
            min-height: 48px;
            border: 1px solid var(--accent);
            border-radius: 6px;
            background: var(--accent);
            color: #041008;
            cursor: pointer;
            font-family: 'Geist Mono', monospace;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.8rem 1rem;
            transition: transform 160ms ease, opacity 160ms ease, background 160ms ease;
        }

        .send-btn:hover,
        .option-btn:hover,
        .retry-btn:hover,
        .schedule-submit:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        .send-btn:disabled,
        .option-btn:disabled,
        .retry-btn:disabled,
        .schedule-submit:disabled {
            cursor: not-allowed;
            opacity: 0.54;
            transform: none;
        }

        .options {
            display: grid;
            gap: 0.6rem;
        }

        .option-btn {
            width: 100%;
            background: var(--surface);
            color: var(--text);
            border-color: var(--border);
            text-align: left;
        }

        .option-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .schedule-form {
            display: grid;
            gap: 0.9rem;
        }

        .schedule-label {
            display: block;
            margin-bottom: 0.45rem;
            color: var(--muted);
            font-family: 'Geist Mono', monospace;
            font-size: 0.68rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .day-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 0.5rem;
        }

        .day-pill input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .day-pill span {
            display: grid;
            min-height: 44px;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-family: 'Geist Mono', monospace;
            font-size: 0.72rem;
            transition: border-color 160ms ease, background 160ms ease, color 160ms ease;
        }

        .day-pill input:checked + span {
            border-color: var(--accent);
            background: rgba(61, 255, 143, 0.14);
            color: var(--accent);
        }

        .status-message {
            margin-top: 0.7rem;
            color: var(--danger);
            font-family: 'Geist Mono', monospace;
            font-size: 0.72rem;
            min-height: 1.1rem;
        }

        .loader-card {
            display: grid;
            place-items: center;
            gap: 0.8rem;
            padding: 1.4rem;
            text-align: center;
        }

        .loader-ring {
            width: 34px;
            height: 34px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 850ms linear infinite;
        }

        .loader-title {
            color: var(--text);
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .loader-copy {
            max-width: 28rem;
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.45;
        }

        @keyframes riseIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%,
            80%,
            100% {
                transform: translateY(0);
                opacity: 0.45;
            }
            40% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (min-width: 720px) {
            .topbar {
                padding-left: 2rem;
                padding-right: 2rem;
            }

            .chat {
                padding: 1.5rem 2rem 2rem;
            }

            .composer {
                padding-left: 2rem;
                padding-right: 2rem;
            }

            .day-grid {
                grid-template-columns: repeat(7, minmax(0, 1fr));
            }
        }

        @media (max-width: 440px) {
            .progress-wrap {
                min-width: 112px;
            }

            .bubble {
                max-width: 90%;
            }

            .text-form {
                grid-template-columns: 1fr;
            }

            .send-btn {
                width: 100%;
            }

            .day-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <a class="brand" href="dashboard.html">PATHI<span>O</span></a>
            <div class="progress-wrap" aria-live="polite">
                <div class="progress-label" id="progress-label">Question 1 of 5</div>
                <div class="progress-track" aria-hidden="true">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
        </header>

        <main class="chat-shell">
            <section class="chat" id="chat" aria-live="polite" aria-label="Onboarding interview messages"></section>
        </main>

        <footer class="composer" id="composer">
            <div class="composer-inner" id="input-area"></div>
        </footer>
    </div>

    <script>
        const API = window.location.hostname === 'localhost'
            ? 'http://localhost:5000/api'
            : 'https://pathio-t9hp.onrender.com/api';

        const state = {
            currentQuestion: null,
            lastPayload: null,
            isSubmitting: false,
        };

        const chat = document.getElementById('chat');
        const inputArea = document.getElementById('input-area');
        const progressLabel = document.getElementById('progress-label');
        const progressFill = document.getElementById('progress-fill');

        const token = localStorage.getItem('pathio_token');

        document.addEventListener('DOMContentLoaded', init);

        async function init() {
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            setupMobileKeyboardHandling();
            await startOnboarding();
        }

        async function apiFetch(path, options = {}) {
            const response = await fetch(`${API}${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    Authorization: `Bearer ${token}`,
                    ...(options.headers || {}),
                },
            });

            const data = await response.json().catch(() => ({}));

            if (!response.ok) {
                const error = new Error(data.message || 'Something went wrong. Please try again.');
                error.status = response.status;
                throw error;
            }

            return data;
        }

        async function startOnboarding() {
            setInputDisabled(true);
            showTyping();

            try {
                const data = await apiFetch('/onboarding/start', { method: 'POST' });
                hideTyping();
                renderQuestion(data.data.question);
            } catch (err) {
                hideTyping();
                showFriendlyError(err.message, startOnboarding);
            }
        }

        function renderQuestion(question) {
            state.currentQuestion = question;
            updateProgress(question.questionNum);
            addMessage('agent', question.question);
            renderInput(question);
        }

        function renderInput(question) {
            inputArea.innerHTML = '';

            if (question.type === 'single_choice') {
                const wrapper = document.createElement('div');
                wrapper.className = 'options';

                question.options.forEach((option) => {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'option-btn';
                    button.textContent = option;
                    button.addEventListener('click', () => submitAnswer(option));
                    wrapper.appendChild(button);
                });

                inputArea.appendChild(wrapper);
                return;
            }

            if (question.type === 'schedule') {
                renderScheduleInput();
                return;
            }

            renderTextInput(question.placeholder || 'Type your answer...');
        }

        function renderTextInput(placeholder) {
            const form = document.createElement('form');
            form.className = 'text-form';
            form.innerHTML = `
                <input class="answer-input" id="answer-input" type="text" autocomplete="off" placeholder="${escapeHtml(placeholder)}">
                <button class="send-btn" type="submit">Send</button>
                <div class="status-message" id="status-message"></div>
            `;

            form.addEventListener('submit', (event) => {
                event.preventDefault();
                const input = document.getElementById('answer-input');
                const answer = input.value.trim();

                if (!answer) {
                    setStatus('Write an answer first.');
                    return;
                }

                submitAnswer(answer);
            });

            inputArea.appendChild(form);

            const input = document.getElementById('answer-input');
            input.focus({ preventScroll: true });
            setTimeout(scrollToBottom, 80);
        }

        function renderScheduleInput() {
            const days = [
                ['monday', 'Mon'],
                ['tuesday', 'Tue'],
                ['wednesday', 'Wed'],
                ['thursday', 'Thu'],
                ['friday', 'Fri'],
                ['saturday', 'Sat'],
                ['sunday', 'Sun'],
            ];

            const form = document.createElement('form');
            form.className = 'schedule-form';
            form.innerHTML = `
                <div>
                    <label class="schedule-label">Learning days</label>
                    <div class="day-grid">
                        ${days.map(([value, label]) => `
                            <label class="day-pill">
                                <input type="checkbox" name="day" value="${value}">
                                <span>${label}</span>
                            </label>
                        `).join('')}
                    </div>
                </div>
                <div>
                    <label class="schedule-label" for="preferred-time">Best time</label>
                    <select class="time-select" id="preferred-time">
                        <option value="">Choose a time</option>
                        <option value="morning">Morning</option>
                        <option value="afternoon">Afternoon</option>
                        <option value="evening">Evening</option>
                        <option value="night">Night</option>
                    </select>
                </div>
                <button class="schedule-submit" type="submit">Finish onboarding</button>
                <div class="status-message" id="status-message"></div>
            `;

            form.addEventListener('submit', (event) => {
                event.preventDefault();
                const preferredDays = Array.from(form.querySelectorAll('input[name="day"]:checked'))
                    .map((input) => input.value);
                const preferredTime = document.getElementById('preferred-time').value;

                if (preferredDays.length === 0) {
                    setStatus('Choose at least one day.');
                    return;
                }

                if (!preferredTime) {
                    setStatus('Choose a time that works for you.');
                    return;
                }

                submitAnswer({
                    preferredDays,
                    preferredTime,
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC',
                });
            });

            inputArea.appendChild(form);
        }

        async function submitAnswer(answer) {
            if (state.isSubmitting || !state.currentQuestion) return;

            state.isSubmitting = true;
            setInputDisabled(true);
            setStatus('');

            const displayAnswer = typeof answer === 'string'
                ? answer
                : `${answer.preferredDays.map(capitalize).join(', ')} at ${answer.preferredTime}`;

            addMessage('user', displayAnswer);

            const payload = {
                questionNum: state.currentQuestion.questionNum,
                answer,
            };
            state.lastPayload = payload;

            showTyping();

            try {
                const data = await apiFetch('/onboarding/answer', {
                    method: 'POST',
                    body: JSON.stringify(payload),
                });

                hideTyping();

                if (data.data.completed) {
                    showRoadmapLoader();
                    pollRoadmapStatus();
                    return;
                }

                await wait(260);
                renderQuestion(data.data.nextQuestion);
            } catch (err) {
                hideTyping();
                showFriendlyError(err.message, () => retryLastAnswer());
            } finally {
                state.isSubmitting = false;
            }
        }

        async function retryLastAnswer() {
            if (!state.lastPayload) {
                await startOnboarding();
                return;
            }

            const retryPayload = state.lastPayload;
            state.lastPayload = null;
            await submitAnswer(retryPayload.answer);
        }

        function showRoadmapLoader() {
            updateProgress(5);
            inputArea.innerHTML = '';
            addMessage('agent', `
                <div class="loader-card">
                    <div class="loader-ring" aria-hidden="true"></div>
                    <div class="loader-title">Building your roadmap...</div>
                    <div class="loader-copy">Pathio is shaping your first learning path around your goal, time, and schedule.</div>
                </div>
            `, true);
        }

        async function pollRoadmapStatus() {
            try {
                const data = await apiFetch('/roadmap/status', { method: 'GET' });

                if (data.data.generated) {
                    window.location.href = 'roadmap.html';
                    return;
                }

                if (data.data.failed) {
                    showFriendlyError(data.data.message || 'Roadmap generation failed. Please try again.', retryRoadmapGeneration);
                    return;
                }

                setTimeout(pollRoadmapStatus, 2000);
            } catch (err) {
                showFriendlyError(err.message || 'Could not check roadmap status. Please try again.', pollRoadmapStatus);
            }
        }

        async function retryRoadmapGeneration() {
            inputArea.innerHTML = '';
            showRoadmapLoader();

            try {
                await apiFetch('/roadmap/generate', { method: 'POST' });
                pollRoadmapStatus();
            } catch (err) {
                showFriendlyError(err.message || 'Could not retry roadmap generation. Please try again.', retryRoadmapGeneration);
            }
        }

        function showFriendlyError(message, retryHandler) {
            inputArea.innerHTML = '';

            addMessage('agent', message || 'I could not save that answer. Please try again.');

            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'retry-btn';
            button.textContent = 'Try again';
            button.addEventListener('click', retryHandler);
            inputArea.appendChild(button);
        }

        function addMessage(sender, content, allowHtml = false) {
            const row = document.createElement('div');
            row.className = `message-row ${sender}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            const label = document.createElement('span');
            label.className = 'message-label';
            label.textContent = sender === 'agent' ? 'Pathio Agent' : 'You';
            bubble.appendChild(label);

            const body = document.createElement('div');
            if (allowHtml) {
                body.innerHTML = content;
            } else {
                body.textContent = content;
            }
            bubble.appendChild(body);

            row.appendChild(bubble);
            chat.appendChild(row);
            scrollToBottom();
        }

        function showTyping() {
            hideTyping();

            const row = document.createElement('div');
            row.className = 'message-row agent typing';
            row.id = 'typing-row';
            row.innerHTML = `
                <div class="bubble" aria-label="Pathio Agent is typing">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            `;

            chat.appendChild(row);
            scrollToBottom();
        }

        function hideTyping() {
            const typing = document.getElementById('typing-row');
            if (typing) typing.remove();
        }

        function setInputDisabled(disabled) {
            inputArea.querySelectorAll('button, input, select').forEach((element) => {
                element.disabled = disabled;
            });
        }

        function setStatus(message) {
            const status = document.getElementById('status-message');
            if (status) status.textContent = message;
        }

        function updateProgress(questionNum) {
            const safeQuestionNum = Math.min(Math.max(Number(questionNum) || 1, 1), 5);
            progressLabel.textContent = `Question ${safeQuestionNum} of 5`;
            progressFill.style.width = `${(safeQuestionNum / 5) * 100}%`;
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                chat.scrollTop = chat.scrollHeight;
            });
        }

        function setupMobileKeyboardHandling() {
            if (!window.visualViewport) return;

            const setOffset = () => {
                const keyboardHeight = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
                document.documentElement.style.setProperty('--bottom-offset', `${keyboardHeight}px`);
                scrollToBottom();
            };

            window.visualViewport.addEventListener('resize', setOffset);
            window.visualViewport.addEventListener('scroll', setOffset);
        }

        function wait(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
        }

        function capitalize(value) {
            return value.charAt(0).toUpperCase() + value.slice(1);
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
